name: iOS-ipa-build

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'APP_VERSION (e.g. 2.1.4). Empty = auto-bump patch from latest tag.'
        required: false
        type: string
      build_number:
        description: 'CFBundleVersion. Empty = derived from version.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # 1) حساب الإصدار
  # ─────────────────────────────────────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'hamandiiii/Flickv4'
          fetch-depth: 0

      - id: resolve
        shell: bash
        env:
          APP_VERSION_INPUT: ${{ github.event.inputs.app_version || '' }}
          BUILD_NUMBER_INPUT: ${{ github.event.inputs.build_number || '' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin || true

          bump_patch() {
            local raw="${1#v}"
            local major=0 minor=0 patch=0
            IFS='.' read -r major minor patch _ <<< "${raw}.0.0"
            echo "${major}.${minor}.$((patch + 1))"
          }

          version_code() {
            local raw="${1#v}"
            local major=0 minor=0 patch=0
            IFS='.' read -r major minor patch _ <<< "${raw}.0.0"
            echo $((major * 10000 + minor * 100 + patch))
          }

          VERSION="${APP_VERSION_INPUT:-}"
          CODE="${BUILD_NUMBER_INPUT:-}"
          RELEASE_TAG=""

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)

          if [ -z "$VERSION" ]; then
            if [ -n "$LATEST_TAG" ]; then
              VERSION="$(bump_patch "$LATEST_TAG")"
            else
              VERSION="2.1.4"
            fi
          fi

          if [ -z "$CODE" ]; then
            CODE="$(version_code "$VERSION")"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v${VERSION}"
          fi

          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${VERSION}, code=${CODE}, tag=${RELEASE_TAG}, latest=${LATEST_TAG:-none}"

  # ─────────────────────────────────────────────
  # 2) بناء iOS + IPA
  # ─────────────────────────────────────────────
  build-ios:
    name: 🎉 iOS Build
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source (Flickv4 @ 2.1.3)
        uses: actions/checkout@v4
        with:
          repository: 'hamandiiii/Flickv4'
          ref: '2.1.3'
          path: src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Configure Xcode Node Environment & TMDB Keys
        working-directory: src
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.build_number }}
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

          cat << EOF > .env
          EXPO_PUBLIC_TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          EXPO_PUBLIC_TMDB_BASE_URL=https://api.themoviedb.org/3
          EXPO_PUBLIC_TMDB_IMAGE_BASE_URL=https://image.tmdb.org/t/p/w500
          EXPO_PUBLIC_TMDB_READ_ACCESS_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxMDExNmZhMzAyYzhmZTBjMmNiYzM4YmUxN2FhNjVhNSIsIm5iZiI6MTc4NzE0MjkzMy4wNiwic3ViamVjdCI6IjZkNWEzMTU0NmQzN2ZlMzYxNjc0NDEzIiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.nHY8A-KhX4-MefoFpq7Wy32K5EVdn9uTsYkCfkcCi_I
          EXPO_PUBLIC_WYZIE_BASE_URL=https://sub.wyzie.io
          EXPO_PUBLIC_WYZIE_API_KEY=
          EXPO_PUBLIC_SAMPLE_VIDEO_URL=https://media.w3.org/2010/05/sintel/trailer.mp4
          EXPO_PUBLIC_WATCH_PARTY_URL=
          TMDB_API_KEY=10116fa302c8fe0c2cbc38be17aa65a5
          APP_VERSION=${APP_VERSION}
          ANDROID_VERSION_CODE=${ANDROID_VERSION_CODE}
          EOF

          node -e '
            const fs = require("fs");
            const file = "src/config/env.ts";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_API_KEY(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"10116fa302c8fe0c2cbc38be17aa65a5\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_BASE_URL(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"https://api.themoviedb.org/3\"");
              content = content.replace(/process\.env\.EXPO_PUBLIC_TMDB_IMAGE_BASE_URL(\s*\|\|\s*["'"'"'"].*?["'"'"'"])?/g, "\"https://image.tmdb.org/t/p/w500\"");
              fs.writeFileSync(file, content, "utf8");
            }
          '

      - name: Install Node Dependencies
        working-directory: src
        run: npm install --legacy-peer-deps

      - name: Fix MMKV and Install CocoaPods
        working-directory: src/ios
        run: |
          rm -f Podfile.lock
          if ! grep -q "pod 'MMKV', '2.3.0'" Podfile; then
            sed -i '' '/target '\''Flick'\'' do/a\
              pod '\''MMKV'\'', '\''2.3.0'\''\
              pod '\''MMKVCore'\'', '\''2.3.0'\''
            ' Podfile
          fi
          pod install --repo-update

      - name: Set iOS version in Info.plist
        working-directory: src
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          PLIST="ios/Flick/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${APP_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" "$PLIST"

      - name: Build Xcode Archive
        working-directory: src/ios
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          xcodebuild -workspace Flick.xcworkspace \
            -scheme Flick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Flick.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            archive

      - name: Package IPA
        working-directory: src/ios
        env:
          APP_VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Flick.xcarchive/Products/Applications/*.app Payload/
          zip -qq -r -9 "coffehouse-${APP_VERSION}.ipa" Payload

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: coffehouse-ios-${{ needs.version.outputs.app_version }}
          path: src/ios/coffehouse-${{ needs.version.outputs.app_version }}.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: src/ios/coffehouse-${{ needs.version.outputs.app_version }}.ipa
          tag: ${{ needs.version.outputs.release_tag }}
          overwrite: true
          body: |
            iOS build from `${{ github.sha }}`
            Version: `${{ needs.version.outputs.app_version }}`
            Build: `${{ needs.version.outputs.build_number }}`
            Trigger: `${{ github.event_name }}` (`${{ github.ref_name }}`)
