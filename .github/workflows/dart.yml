name: iOS-ipa-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Pod install (if Podfile exists)
        run: |
          if [ -f Podfile ]; then pod install; fi
        working-directory: ios

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          rm -rf Payload FlutterIpaExport.ipa
          mkdir Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport-${{ github.run_number }}
          path: build/ios/iphoneos/FlutterIpaExport.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'ios-latest' }}
          overwrite: true
          body: "iOS build from ${{ github.sha }} (${{ github.ref_name }})"
